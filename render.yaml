services:
  - type: web
    name: ci-doctor
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

